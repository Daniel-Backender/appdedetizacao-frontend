<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Clientes</title>
    <style>
        :root {
            --verde-pest: #4ade80; 
            --verde-escuro: #16a34a;
            --cinza-fundo: #0a0a0a; /* Ajustado para Cyber-Industrial */
            --cinza-escuro: #4b5563;
            --cinza-header: #111;
            --texto-escuro: #fff;
            --vermelho-inativo: #ef4444;
            --amarelo-pendente: #facc15;
            --neon-glow: #3DDC84;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #161B26;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(61, 220, 132, 0.1);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 80px;
            border-left: 1px solid #2d3748;
            border-right: 1px solid #2d3748;
        }

        .header {
            background: #111;
            border-bottom: 2px solid var(--neon-glow);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-voltar {
            background: transparent;
            border: 1px solid var(--neon-glow);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            color: var(--neon-glow);
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .btn-voltar:hover { background: var(--neon-glow); color: #000; box-shadow: 0 0 10px var(--neon-glow);}

        .header-title { font-size: 24px; font-weight: 800; color: #fff; margin: 0; }
        .header-title span { color: var(--neon-glow); text-shadow: 0 0 8px var(--neon-glow); } 

        .sub-header {
            background: var(--cinza-header);
            color: #a0aec0;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2d3748;
        }

        #telaLista, #telaDetalhes { padding: 15px; }

        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar input {
            flex: 1; padding: 10px 15px; background: #0F0F12; color: #fff;
            border: 1px solid #4a5568; border-radius: 5px; outline: none;
        }
        .search-bar button {
            background: var(--neon-glow); color: #000; border: none;
            padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;
        }

        table { width: 100%; border-collapse: collapse; background: #1a202c; border-radius: 8px; overflow: hidden; font-size: 13px; }
        th { background: rgba(61, 220, 132, 0.1); padding: 12px; text-align: left; color: var(--neon-glow); border-bottom: 1px solid #2d3748;}
        td { padding: 12px; border-bottom: 1px solid #2d3748; vertical-align: middle; }

        .badge-ativo { color: var(--neon-glow); font-weight: bold; }
        .badge-inativo { background: var(--vermelho-inativo); color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px;}

        .btn-detalhes { background: var(--neon-glow); color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        
        .footer-actions { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; padding: 0 15px; }
        .btn-acao { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; color: #000; cursor: pointer; text-align: center; font-size: 13px; }
        .btn-novo { background: var(--neon-glow); box-shadow: 0 0 10px rgba(61,220,132,0.4);}
        
        #telaDetalhes { display: none; }
        
        /* Estilos da Ficha */
        .card-perfil { background: #1a202c; border-radius: 8px; padding: 15px; display: flex; gap: 15px; margin-bottom: 15px; border: 1px solid #2d3748; }
        .avatar { width: 60px; height: 60px; background: rgba(61,220,132,0.1); border: 1px solid var(--neon-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .info-perfil p { margin: 4px 0; font-size: 13px; color: #a0aec0;}
        .info-perfil strong { color: #fff; }
        .secao-titulo { background: rgba(61, 220, 132, 0.1); color: var(--neon-glow); padding: 8px 15px; border-radius: 4px; font-weight: bold; margin-top: 15px; margin-bottom: 10px; font-size: 12px; text-transform: uppercase;}
        .secao-conteudo p { margin: 6px 0; border-bottom: 1px dashed #2d3748; padding-bottom: 5px; font-size: 13px; color: #a0aec0;}
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <button class="btn-voltar" onclick="voltarTela()">&#8617;</button>
        <h1 class="header-title">BugTecho<span>X</span></h1>
        <div style="width: 40px;"></div>
    </div>

    <div id="telaLista">
        <div class="sub-header">Base de Clientes (Sincronizado)</div>
        <br>
        
        <div class="search-bar">
            <input type="text" id="inputBusca" placeholder="Buscar no banco de dados..." oninput="filtrarClientesLocal()">
            <button onclick="carregarClientesDoServidor()">Recarregar API</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF/CNPJ</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaClientes">
                <tr><td colspan="3" style="text-align: center;">Buscando dados no servidor...</td></tr>
            </tbody>
        </table>

        <div class="footer-actions">
            <button class="btn-acao btn-novo" onclick="alert('Funcionalidade de cadastro via mobile em desenvolvimento!')">⊕ Novo Cliente</button>
        </div>
    </div>

    <div id="telaDetalhes">
        <div class="sub-header">Ficha Corporativa do Cliente</div>
        <br>
        <div class="card-perfil">
            <div class="avatar-container">
                <div class="avatar">
                    <svg width="30" height="30" fill="#3DDC84" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </div>
            <div class="info-perfil" id="detalheGeral">
                </div>
        </div>

        <div class="secao-titulo">Contato & Endereço</div>
        <div class="secao-conteudo" id="detalheEndereco">
             </div>

        <div class="footer-actions">
            <button class="btn-acao" style="background: #4a5568; color: white;" onclick="voltarTela()">Voltar para Lista</button>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // 1. CONFIGURAÇÕES E VARIÁVEIS REAIS
    // ==========================================
    const API_URL = "https://appdedetizacao.onrender.com";
    const token = localStorage.getItem("tokenJWT") || localStorage.getItem("token"); // Tenta as duas chaves comuns
    const empresaId = localStorage.getItem("empresaId") || "1";
    
    let clientesGlobais = []; // Vai guardar a resposta real da API

    if (!token) {
        alert("Sessão expirada ou Token ausente. Retorne ao login.");
    }

    // ==========================================
    // 2. BUSCA NO BANCO DE DADOS (API REST)
    // ==========================================
    async function carregarClientesDoServidor() {
        const tbody = document.getElementById("tabelaClientes");
        tbody.innerHTML = "<tr><td colspan='3' style='text-align: center; color: #3DDC84;'>Processando...</td></tr>";

        try {
            const response = await fetch(`${API_URL}/api/clientes/empresa/${empresaId}`, {
                method: 'GET',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error(`Erro API: ${response.status}`);

            clientesGlobais = await response.json();
            renderizarTabela(clientesGlobais);

        } catch (error) {
            console.error("Falha ao puxar clientes:", error);
            tbody.innerHTML = `<tr><td colspan='3' style='text-align: center; color: #ef4444;'>Falha ao conectar com o banco de dados.</td></tr>`;
        }
    }

    // ==========================================
    // 3. RENDERIZAÇÃO E FILTROS
    // ==========================================
    function renderizarTabela(lista) {
        const tbody = document.getElementById("tabelaClientes");
        tbody.innerHTML = "";

        if (lista.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' style='text-align: center;'>Nenhum cliente cadastrado nesta empresa.</td></tr>";
            return;
        }

        lista.forEach(c => {
            // Mapeando os nomes dos campos que o seu Spring Boot (Java) cospe no JSON
            const nome = c.nome || c.nomeCompleto || 'Sem Nome';
            const documento = c.cpf || c.cnpj || 'N/A';
            
            tbody.innerHTML += `
                <tr>
                    <td><strong>${nome}</strong></td>
                    <td>${documento}</td>
                    <td><button class="btn-detalhes" onclick="abrirDetalhes(${c.id})">VER FICHA</button></td>
                </tr>
            `;
        });
    }

    function filtrarClientesLocal() {
        const termo = document.getElementById("inputBusca").value.toLowerCase();
        const filtrados = clientesGlobais.filter(c => {
            const nome = (c.nome || c.nomeCompleto || '').toLowerCase();
            const doc = (c.cpf || c.cnpj || '').toLowerCase();
            return nome.includes(termo) || doc.includes(termo);
        });
        renderizarTabela(filtrados);
    }

    // ==========================================
    // 4. FLUXO DE NAVEGAÇÃO INTERNA
    // ==========================================
    function abrirDetalhes(id) {
        const cliente = clientesGlobais.find(c => c.id === id);
        if(!cliente) return;

        document.getElementById("detalheGeral").innerHTML = `
            <p>ID Sistema: <strong>#${cliente.id}</strong></p>
            <p>Nome: <strong>${cliente.nome || cliente.nomeCompleto}</strong></p>
            <p>Doc: <strong>${cliente.cpf || cliente.cnpj || 'Não informado'}</strong></p>
        `;

        document.getElementById("detalheEndereco").innerHTML = `
            <p>Telefone: <strong>${cliente.telefone || 'Sem registro'}</strong></p>
            <p>E-mail: <strong>${cliente.email || 'Sem registro'}</strong></p>
            <p>Endereço: <strong>${cliente.endereco || cliente.rua || 'Pendente de atualização via App'}</strong></p>
        `;

        document.getElementById("telaLista").style.display = "none";
        document.getElementById("telaDetalhes").style.display = "block";
    }

    function voltarTela() {
        if (document.getElementById("telaDetalhes").style.display === "block") {
            document.getElementById("telaDetalhes").style.display = "none";
            document.getElementById("telaLista").style.display = "block";
        } else {
            // Volta pro Painel Central
            window.location.href = "dashboard_empresa.html";
        }
    }

    // Dispara a busca real ao abrir a tela
    window.onload = carregarClientesDoServidor;
</script>
</body>
</html>
