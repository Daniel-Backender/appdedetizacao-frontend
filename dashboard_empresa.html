<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Painel Corporativo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ff0000;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navegação Principal */
        header {
            background-color: #151821;
            border-bottom: 2px solid #00ff87;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Correção do tamanho da Logo */
        .logo-container img {
            height: 45px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .brand span {
            color: #00ff87;
        }

        /* Container Principal */
        .main-wrapper {
            flex: 1;
            display: flex;
        }

        /* Painel de Conteúdo */
        .content-container {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Seções/Cards */
        .card {
            background: #151821;
            border: 1px solid #2d313f;
            border-radius: 12px;
            padding: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2d313f;
            padding-bottom: 12px;
        }

        .card-title {
            font-size: 18px;
            color: #ffffff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Botões */
        .btn {
            background-color: #00ff87;
            color: #0b0c10;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #00e074;
            box-shadow: 0 0 12px rgba(0, 255, 135, 0.3);
        }

        /* Tabelas */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #1e2230;
            color: #94a3b8;
            padding: 14px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #2d313f;
            font-size: 15px;
        }

        tr:hover td {
            background-color: #1a1d29;
        }

        /* Seção Sobre a Empresa */
        .profile-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #94a3b8;
            font-size: 14px;
        }

        textarea {
            background-color: #1e2230;
            border: 1px solid #2d313f;
            border-radius: 6px;
            color: #ffffff;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
            min-height: 120px;
            outline: none;
        }

        textarea:focus {
            border-color: #00ff87;
        }

        /* Correção do Rodapé */
        footer {
            background-color: #151821;
            border-top: 1px solid #2d313f;
            padding: 12px 24px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-container">
                <img src="logo2.png" alt="PestControlX" onerror="this.src='https://via.placeholder.com/150x45/151821/00ff87?text=PestControlX'">
            </div>
            <h1>PestControlX <span>Painel</span></h1>
        </div>
    </header>

    <div class="main-wrapper">
        <div class="content-container">
            
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">Chamadas e Solicitações de Serviço</h2>
                    <button class="btn" id="btnAtualizarOS" onclick="carregarSolicitacoes()">Atualizar Tabela</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Serviço</th>
                                <th>Data/Hora</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaOSBody">
                            <tr>
                                <td colspan="5" style="text-align: center; color: #64748b;">Clique em Atualizar para carregar dados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">Perfil Corporativo</h2>
                </div>
                <div class="profile-section">
                    <div class="form-group">
                        <label for="txtSobreEmpresa">Sobre a Empresa (Visível no Aplicativo do Cliente):</label>
                        <textarea id="txtSobreEmpresa" placeholder="Descreva os serviços, especialidades e informações da sua empresa que aparecerão para os clientes..."></textarea>
                    </div>
                    <div>
                        <button class="btn" onclick="salvarSobreEmpresa()">Salvar Alterações</button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <footer>
        PestControlX &copy; 2026 - Todos os direitos reservados.
    </footer>

    <script src="app.js"></script>
</body>
</html>
