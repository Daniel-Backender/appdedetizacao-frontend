<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Painel Corporativo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --bg-main: #F4F6F9; /* Cinza claro de fundo industrial */
            --bg-card: #FFFFFF; /* Branco puro para os painéis */
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 70px;
            --text-dark: #2E384D;
            --text-muted: #7B8794;
            --pest-green: #3CB371; /* Verde médio corporativo */
            --border-color: #E1E4E8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

        /* --- NAVBAR SUPERIOR --- */
        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: var(--sidebar-width);
            height: 64px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: all 0.3s ease;
            z-index: 99;
        }

        /* --- SIDEBAR RECLINÁVEL --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            height: 100vh;
            z-index: 100;
        }

        /* Estado recolhido da barra lateral */
        body.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed-width); padding: 20px 10px; }
        body.sidebar-collapsed .topbar { left: var(--sidebar-collapsed-width); }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        body.sidebar-collapsed .nav-btn span, body.sidebar-collapsed .logo-area h2, body.sidebar-collapsed .profile-name { display: none; }
        body.sidebar-collapsed .profile-pic { width: 40px; height: 40px; font-size: 16px; }

        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .logo-area h2 { font-size: 20px; font-weight: 800; color: var(--text-dark); }
        .logo-area h2 span { color: var(--pest-green); }

        .toggle-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; transition: 0.2s;
        }
        .toggle-btn:hover { color: var(--pest-green); }

        .profile-area { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .profile-pic { width: 64px; height: 64px; background-color: #F0F2F5; border-radius: 50%; margin: 0 auto 8px; border: 2px solid var(--pest-green); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--pest-green); }
        .profile-name { font-size: 14px; font-weight: 600; color: var(--text-dark); word-break: break-all; }

        .nav-buttons { display: flex; flex-direction: column; gap: 8px; }
        .nav-btn { background: none; color: var(--text-muted); border: 1px solid transparent; padding: 12px 16px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; display: flex; align-items: center; gap: 12px; font-weight: 600; width: 100%; }
        .nav-btn i { font-size: 18px; width: 24px; text-align: center; }
        .nav-btn:hover, .nav-btn.active { color: var(--pest-green); background: #E8F5E9; }
        
        .logout-btn { background-color: #FFF0F0; color: #D32F2F; border: 1px solid #FFCDD2; margin-top: auto; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logout-btn:hover { background-color: #FFCDD2; }

        /* --- ÁREA DE CONTEÚDO --- */
        .main-content { flex: 1; margin-left: 0; padding: 94px 30px 30px 30px; overflow-y: auto; transition: all 0.3s ease; }
        .section-view { display: none; }
        .section-view.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 24px; color: var(--text-dark); margin-bottom: 20px; font-weight: 700; }

        /* --- CLIENTES TABLE & FORM STYLES --- */
        .card { background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #F8FAF6; color: var(--text-dark); font-weight: 700; }
        tr:hover { background-color: #FAFAFA; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #E8F5E9; color: var(--pest-green); }

        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 600; color: var(--text-dark); font-size: 14px; }
        .form-group textarea, .form-group input { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: #FAFAFA; font-size: 14px; outline: none; width: 100%; }
        .form-group textarea:focus, .form-group input:focus { border-color: var(--pest-green); background: #FFF; }
        
        .btn-salvar { background-color: var(--pest-green); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-salvar:hover { background-color: #2E8B57; }

        /* --- CENTRAL DE CHAT PREMIUM --- */
        .chat-container { display: flex; flex-direction: column; height: 60vh; background: #FAFAFA; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 70%; font-size: 14px; line-height: 1.4; }
        .sent { align-self: flex-end; background: var(--pest-green); color: #FFF; border-bottom-right-radius: 2px; box-shadow: 0 2px 4px rgba(60,179,113,0.2); }
        .received { align-self: flex-start; background: var(--bg-card); color: var(--text-dark); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
        
        .chat-input-area { display: flex; padding: 16px; background: var(--bg-card); border-top: 1px solid var(--border-color); gap: 12px; }
        #msg-input { flex: 1; background: #FAFAFA; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; outline: none; }
        .chat-input-area button { background: var(--pest-green); color: white; border: none; padding: 0 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header class="topbar">
        <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div style="font-weight: 600; color: var(--text-muted);">Painel de Controle v2.1</div>
    </header>

    <nav class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-bug" style="color: var(--pest-green); font-size: 24px;"></i>
            <h2>PestControl<span>X</span></h2>
        </div>

        <div class="profile-area">
            <div class="profile-pic"><i class="fa-solid fa-user-tie"></i></div>
            <div class="profile-name" id="userName">Carregando...</div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('clientes', this)"><i class="fa-solid fa-users"></i> <span>Clientes</span></button>
            <button class="nav-btn" onclick="showSection('sobre', this)"><i class="fa-solid fa-id-card"></i> <span>Sobre a Empresa</span></button>
            <button class="nav-btn" onclick="showSection('chat', this)"><i class="fa-regular fa-comments"></i> <span>Central de Chat</span></button>
        </div>

        <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-power-off"></i> <span>SAIR</span></button>
    </nav>

    <main class="main-content">
        
        <section id="clientes" class="section-view active">
            <h1>Clientes Registrados</h1>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>ID da Conversa</th>
                            <th>Identificador do Cliente</th>
                            <th>Status do Atendimento</th>
                        </tr>
                    </thead>
                    <tbody id="lista-clientes-corpo">
                        <tr>
                            <td>#1024</td>
                            <td>Usuário do Aplicativo Mobile</td>
                            <td><span class="status-badge">Ativo</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="sobre" class="section-view">
            <h1>Configurações do Perfil (App)</h1>
            <div class="card">
                <form id="formPerfilEmpresa" onsubmit="salvarDadosPerfil(event)">
                    <div class="form-group">
                        <label for="inputSobre">Descrição da Empresa ("Sobre")</label>
                        <textarea id="inputSobre" rows="5" placeholder="Conte aos clientes o histórico da sua empresa, certificações e especialidades de dedetização..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="inputMensagemBot">Mensagem de Saudação Automática (Chatbot)</label>
                        <input type="text" id="inputMensagemBot" placeholder="Ex: Olá! Seja bem-vindo à nossa dedetizadora. Em que podemos ajudar hoje?">
                    </div>
                    <button type="submit" class="btn-salvar">SALVAR PERFIL</button>
                </form>
            </div>
        </section>

        <section id="chat" class="section-view">
            <h1>Terminal de Atendimento</h1>
            <div class="chat-container">
                <div class="chat-messages" id="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Digite a resposta para o cliente..." onkeypress="if(event.key==='Enter') enviarMsgStomp()">
                    <button onclick="enviarMsgStomp()">ENVIAR</button>
                </div>
            </div>
        </section>
    </main>

    
</body>
</html>
