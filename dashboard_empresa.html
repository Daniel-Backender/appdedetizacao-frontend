<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Painel de Controle</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body class="dark-theme">

    <header class="topbar">
        <div class="topbar-left">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 class="topbar-company-name">PestControlX Operations</h1>
        </div>
        <div class="topbar-right">
            <div class="profile-pic-top"><i class="fa-solid fa-building text-glow-neon"></i></div>
        </div>
    </header>

    <nav class="sidebar" id="app-sidebar">
        <div class="profile-area">
            <div class="profile-name" id="userName">Carregando...</div>
            <div class="profile-role">Adminstrador</div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn" onclick="navegarIframe('clientes.html', this)"><i class="fa-solid fa-users"></i> <span>Clientes</span></button>
            <button class="nav-btn active" onclick="mostrarSecaoDashboard()"><i class="fa-solid fa-list-check"></i> <span>Solicitações (OS)</span></button>
            <button class="nav-btn" onclick="navegarIframe('chat.html', this)"><i class="fa-regular fa-comments"></i> <span>Central de Chat</span></button>
        </div>

        <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-power-off"></i> <span>SAIR</span></button>
    </nav>

    <main class="main-content" id="app-main-content">
        
        <section id="solicitacoes" class="section-view active">
            <div class="section-header-block">
                <h1>Monitoramento de Operações</h1>
                <span class="text-glow-neon"><i class="fa-solid fa-circle-nodes"></i> Conexão DB Ativa</span>
            </div>
            
            <div class="kanban-board">
                <div class="kanban-col" id="col-pendentes">
                    <div class="kanban-header badge-danger">Novas Solicitações</div>
                    <div class="os-cards-container"></div>
                </div>
                <div class="kanban-col" id="col-campo">
                    <div class="kanban-header badge-warning">Em Andamento</div>
                    <div class="os-cards-container"></div>
                </div>
                <div class="kanban-col" id="col-concluidas">
                    <div class="kanban-header badge-success">Concluídas</div>
                    <div class="os-cards-container"></div>
                </div>
            </div>
        </section>

        <section id="iframe-container" class="section-view" style="display: none; padding: 0;">
            <iframe id="telaExterna" src="" style="width: 100%; height: calc(100vh - 80px); border: none;"></iframe>
        </section>

    </main>

    <script>
        const API_URL = "https://appdedetizacao.onrender.com";
        const token = localStorage.getItem("tokenJWT") || localStorage.getItem("token");

        if (!token) {
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const email = localStorage.getItem("userEmail") || "Admin";
            document.getElementById("userName").innerText = email;
            carregarOrdensDoServidor();
            // Atualiza as ordens sozinho a cada 30 segundos
            setInterval(carregarOrdensDoServidor, 30000); 
        });

        // Controle de Exibição (Alterna entre o Kanban e o iFrame com as outras telas)
        function navegarIframe(url, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            document.getElementById('solicitacoes').classList.remove('active');
            document.getElementById('solicitacoes').style.display = 'none';
            
            const container = document.getElementById('iframe-container');
            container.style.display = 'block';
            container.classList.add('active');
            
            document.getElementById('telaExterna').src = url;
        }

        function mostrarSecaoDashboard() {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.nav-btn[onclick="mostrarSecaoDashboard()"]').classList.add('active');

            document.getElementById('iframe-container').style.display = 'none';
            
            const secaoSol = document.getElementById('solicitacoes');
            secaoSol.style.display = 'block';
            secaoSol.classList.add('active');
            
            carregarOrdensDoServidor(); // Recarrega os dados ao abrir
        }

        // Requisição Real para a API de Ordens de Serviço
        async function carregarOrdensDoServidor() {
            try {
                const response = await fetch(`${API_URL}/api/solicitacoes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) return;
                const ordens = await response.json();
                
                document.querySelectorAll('.os-cards-container').forEach(el => el.innerHTML = '');

                ordens.forEach(os => {
                    const card = `
                        <div class="os-card" style="border: 1px solid #333; background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
                            <h4 style="color: #3DDC84; margin-top:0;">#${os.id} - ${os.descricao}</h4>
                            <p style="color: #ccc; font-size: 13px;">Cliente: ${os.clienteNome || 'Desconhecido'}</p>
                            <p style="color: #888; font-size: 12px; margin-bottom: 0;">Data: ${os.dataAgendamento || 'Não agendado'}</p>
                        </div>
                    `;
                    
                    if (os.status === 'PENDENTE') {
                        document.querySelector('#col-pendentes .os-cards-container').innerHTML += card;
                    } else if (os.status === 'EM_ANDAMENTO') {
                        document.querySelector('#col-campo .os-cards-container').innerHTML += card;
                    } else {
                        document.querySelector('#col-concluidas .os-cards-container').innerHTML += card;
                    }
                });
            } catch (e) {
                console.error("Falha ao sincronizar OS com o servidor:", e);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
