<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PestControlX - Central de Controle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
    </script>

    <header class="topbar">
        <div class="topbar-left">
            <button class="toggle-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            <h1 style="color: var(--primary); font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-shield-virus"></i> PestControlX
            </h1>
        </div>
        <div id="topbar-pic" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); overflow: hidden; background: #ccc;">
            <img id="imgPfpTopbar" src="https://via.placeholder.com/150" style="width:100%; height:100%; object-fit:cover;">
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="profile-area">
            <div class="profile-pic-container">
                <img id="imgPfpSidebar" src="https://via.placeholder.com/150">
                <label class="change-pic-btn" for="filePfpInput">Alterar</label>
            </div>
            <input type="file" id="filePfpInput" accept="image/*" style="display:none;" onchange="uploadFotoPerfil(this)">
            <div id="userName" style="font-weight: 700; color: var(--text-main); font-size: 15px; margin-top: 5px; word-break: break-all;">Admin</div>
            <div id="userEmail" style="font-size: 12px; color: var(--text-muted); word-break: break-all;">carregando...</div>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="navegar(this, 'solicitacoes.html')"><i class="fa-solid fa-chart-line"></i> <span>Monitoramento</span></button>
            <button class="nav-btn" onclick="navegar(this, 'clientes.html')"><i class="fa-solid fa-users"></i> <span>Clientes</span></button>
            <button class="nav-btn" onclick="navegar(this, 'chat.html')"><i class="fa-regular fa-comments"></i> <span>Chat ao Vivo</span></button>
            <button class="nav-btn" onclick="navegar(this, 'sobre.html')"><i class="fa-solid fa-building-shield"></i> <span>Sobre a Empresa</span></button>
            <button class="nav-btn" onclick="navegar(this, 'configuracoestela.html')"><i class="fa-solid fa-sliders"></i> <span>Configurações</span></button>
        </div>
        <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-power-off"></i> <span>SAIR DO SISTEMA</span></button>
    </nav>

    <main class="main-content" id="mainContent" style="padding: 0;">
        <iframe id="telaExterna" src="solicitacoes.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
