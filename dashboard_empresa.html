<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Painel da Empresa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #1c1c1c;
            --bg-panel: #1e1e1e;
            --neon-green: #39ff14;
            --text-light: #e0e0e0;
            --text-muted: #97ff206e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background-color: var(--bg-panel); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; z-index: 999; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        .logo-area h2 span { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }

        .profile-area { text-align: center; margin-bottom: 30px; }
        .profile-pic { width: 80px; height: 80px; background-color: #333; border-radius: 50%; margin: 0 auto 10px; border: 2px solid var(--neon-green); display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--neon-green); }

        .nav-buttons { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { background-color: #2a2a2a; color: var(--text-light); border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { border-color: var(--neon-green); color: var(--neon-green); background: #1a1a1a; }
        
        .logout-btn { background-color: #441111; color: #ff4444; border: 1px solid #ff4444; margin-top: auto; padding: 12px; border-radius: 8px; cursor: pointer; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .section-view { display: none; }
        .section-view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Estilo Tabela e Cards mantidos como o seu... */
        .chat-container { display: flex; flex-direction: column; height: 65vh; background: #000; border: 1px solid var(--neon-green); border-radius: 8px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-family: monospace; }
        .msg { padding: 10px; border-radius: 5px; max-width: 80%; }
        .sent { align-self: flex-end; background: var(--neon-green); color: #000; font-weight: bold; }
        .received { align-self: flex-start; border: 1px solid var(--neon-green); color: var(--neon-green); }
        
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #333; }
        #msg-input { flex: 1; background: #111; border: 1px solid #444; color: #fff; padding: 10px; outline: none; }
        .chat-input-area button { background: var(--neon-green); border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-bug" style="color: var(--neon-green);"></i>
            <h2>PestControl<span>X</span></h2>
        </div>

        <div class="profile-area">
            <div class="profile-pic"><i class="fa-solid fa-user-tie"></i></div>
            <div class="profile-name" id="userName">Carregando...</div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('clientes', this)"><i class="fa-solid fa-users"></i> Clientes</button>
            <button class="nav-btn" onclick="showSection('ordens', this)"><i class="fa-solid fa-clipboard-list"></i> Ordens</button>
            <button class="nav-btn" onclick="showSection('agenda', this)"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
            <button class="nav-btn" onclick="showSection('chat', this)"><i class="fa-regular fa-comments"></i> Central de Chat</button>
        </div>

        <button class="logout-btn" onclick="logout()">SAIR</button>
    </nav>

    <main class="main-content">
        <!-- SEÇÃO CLIENTES -->
        <section id="clientes" class="section-view active">
            <h1>Clientes Registrados</h1>
            <table>
                <thead><tr><th>ID</th><th>Nome</th><th>Status</th></tr></thead>
                <tbody><tr><td>01</td><td>Condomínio Bosque</td><td>Ativo</td></tr></tbody>
            </table>
        </section>

        <!-- SEÇÃO ORDENS -->
        <section id="ordens" class="section-view">
            <h1>Ordens de Serviços</h1>
            <p>Nenhuma ordem pendente.</p>
        </section>

        <!-- SEÇÃO DASHBOARD -->
        <section id="agenda" class="section-view">
            <h1>Dashboard Financeiro</h1>
            <div class="card"><h3>Total</h3><div class="value">R$ 4.200</div></div>
        </section>

        <!-- SEÇÃO CHAT -->
        <section id="chat" class="section-view">
            <h1>Terminal de Comando - Chat</h1>
            <div class="chat-container">
                <div class="chat-messages" id="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Digite para o técnico..." onkeypress="if(event.key==='Enter') enviarMsgStomp()">
                    <button onclick="enviarMsgStomp()">ENVIAR</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. LÓGICA DE NAVEGAÇÃO E USUÁRIO ---
        function showSection(id, btn) {
            document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        window.onload = function() {
            const email = localStorage.getItem("userEmail") || "Admin";
            document.getElementById("userName").innerText = email;
            conectarChat();
        };

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        // --- 2. LÓGICA DO CHAT (STOMP) ---
        var stompClient = null;
        const SERVER_URL = 'https://appdedetizacao.onrender.com/ws-pestcontrol';

        function conectarChat() {
            var socket = new SockJS(SERVER_URL);
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Remove logs chatos no console

            stompClient.connect({}, function (frame) {
                printMensagem("SISTEMA ONLINE", "received");
                
                stompClient.subscribe('/topic/mensagens', function (msg) {
                    var dados = JSON.parse(msg.body);
                    if(dados.remetente !== 'EMPRESA') {
                        // Usando dados.texto conforme o Java
                        printMensagem(dados.remetente + ": " + dados.texto, "received");
                    }
                });
            }, function(err) {
                setTimeout(conectarChat, 5000);
            });
        }

        function enviarMsgStomp() {
            var input = document.getElementById('msg-input');
            var texto = input.value.trim();
            
            if(texto && stompClient) {
                // CHAVE 'texto' PARA BATER COM O BACKEND
                var payload = JSON.stringify({'remetente': 'EMPRESA', 'texto': texto});
                stompClient.send("/app/enviar", {}, payload);
                printMensagem("VOCÊ: " + texto, "sent");
                input.value = '';
            }
        }

        function printMensagem(txt, tipo) {
            var box = document.getElementById('chat-box');
            box.innerHTML += `<div class="msg ${tipo}">${txt}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
