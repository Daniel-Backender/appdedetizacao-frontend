<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PestControlX - Painel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <script src="js/theme.js"></script>

    <header class="topbar">
        <h1 style="color: var(--primary); font-size: 20px;"><i class="fa-solid fa-leaf"></i> PestControlX</h1>
        <div class="profile-pic-top"><i class="fa-solid fa-building" style="color: var(--primary);"></i></div>
    </header>

    <nav class="sidebar">
        <div class="profile-area" style="padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color);">
            <div id="userName" style="font-weight: bold; color: var(--text-main);">Admin</div>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="navegar(this, 'solicitacoes.html')"><i class="fa-solid fa-list-check"></i> Monitoramento</button>
            <button class="nav-btn" onclick="navegar(this, 'clientes.html')"><i class="fa-solid fa-users"></i> Clientes</button>
            <button class="nav-btn" onclick="navegar(this, 'chat.html')"><i class="fa-regular fa-comments"></i> Chat</button>
            <button class="nav-btn" onclick="navegar(this, 'configuracoestela.html')"><i class="fa-solid fa-gear"></i> Configurações</button>
        </div>
        <button class="logout-btn" onclick="logout()" style="margin-top: auto; color: #E53E3E; background: none; border: none; padding: 15px; cursor: pointer; text-align: left; font-weight: bold;"><i class="fa-solid fa-power-off"></i> SAIR</button>
    </nav>

    <main class="main-content" style="padding: 0;">
        <iframe id="telaExterna" src="solicitacoes.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
