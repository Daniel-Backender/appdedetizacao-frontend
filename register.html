<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta | Nome do Produto</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <div class="brand-container">
        <div class="logo-wrapper">
            <div class="logo-placeholder-img"></div> 
        </div>
        <img src="img/nomeapp copy.png" alt="">
        <p class="brand-tagline">Gestão Profissional de Controle de Pragas</p>
    </div>

    <form id="registerForm" class="glass-card">
        
        <div class="input-group full">
            <label for="tipo">Tipo de Perfil</label>
            <div class="select-wrapper">
                <select id="tipo">
                    <option value="" disabled selected>Como você deseja usar o app?</option>
                    <option value="CLIENTE">Sou Cliente</option>
                    <option value="EMPRESA">Sou uma Empresa</option>
                    <option value="FUNCIONARIO">Sou Funcionário</option>
                </select>
            </div>
        </div>

        <div class="steps-container">
            <div id="step1" class="step active">
                <div class="form-grid">
                    <div class="input-group">
                        <label>CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>
                    <div class="input-group">
                        <label>Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123">
                    </div>
                    <div class="input-group full">
                        <label>Logradouro</label>
                        <input type="text" id="rua" placeholder="Rua, Avenida...">
                    </div>
                    <div class="input-group full">
                        <label>Bairro</label>
                        <input type="text" id="bairro" placeholder="Seu bairro">
                    </div>
                </div>
                <button type="button" class="btn-primary" onclick="nextStep()">
                    Próximo passo
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>

            <div id="step2" class="step">
                <div class="form-grid">
                    <div class="input-group full">
                        <label>E-mail corporativo</label>
                        <input type="email" id="email" placeholder="nome@empresa.com">
                    </div>
                    <div class="input-group full">
                        <label>Senha de acesso</label>
                        <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
                    </div>
                    <div class="input-group full" id="cnpjGroup" style="display:none;">
                        <label>CNPJ da Unidade</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0001-00">
                    </div>
                </div>

                <div class="actions-footer">
                    <button type="button" class="btn-ghost" onclick="prevStep()">Voltar</button>
                    <button type="submit" class="btn-primary">Finalizar Cadastro</button>
                </div>
            </div>
        </div>
    </form>

    <script src="js/register.js"></script>
</body>
</html>
