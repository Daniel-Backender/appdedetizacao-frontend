<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | PestControlX</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="brand-container">
        <div class="logo-wrapper">
            <img src="img/logo2 copy.png" alt="Logo" class="logo-img">
        </div>
        <img src="img/nomeapp copy.png" alt="PestControlX" class="app-name-img">
    </div>

    <form id="registerForm" class="glass-card">
        <div class="input-group full">
            <label for="tipo">Tipo de Perfil</label>
            <div class="select-wrapper">
                <select id="tipo">
                    <option value="" disabled selected>Selecione o acesso</option>
                    <option value="EMPRESA">Empresa (Painel de Gestão)</option>
                    <option value="ADMINISTRADOR">Administrador (Suporte)</option>
                </select>
            </div>
        </div>

        <div class="steps-container">
            <div id="step1" class="step active">
                <div class="form-grid">
                    <div class="input-group full">
                        <label for="nome">Nome Completo / Razão Social</label>
                        <input type="text" id="nome" placeholder="Digite seu nome ou da empresa" required>
                    </div>
                    <div class="input-group">
                        <label>CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>
                    <div class="input-group">
                        <label>Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123">
                    </div>
                    <div class="input-group full">
                        <label>Rua</label>
                        <input type="text" id="rua" placeholder="Rua...">
                    </div>
                    <div class="input-group full">
                        <label>Bairro</label>
                        <input type="text" id="bairro" placeholder="Bairro">
                    </div>
                </div>
                <button type="button" class="btn-primary" onclick="nextStep()">Próximo passo</button>
            </div>

            <div id="step2" class="step">
                <div class="form-grid">
                    <div class="input-group full">
                        <label>E-mail corporativo</label>
                        <input type="email" id="email" placeholder="nome@empresa.com">
                    </div>
                    <div class="input-group full">
                        <label>Senha de acesso</label>
                        <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
                    </div>
                    <div class="input-group full" id="cnpjGroup" style="display:none;">
                        <label>CNPJ da Unidade</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0001-00">
                    </div>
                </div>
                <div class="actions-footer">
                    <button type="button" class="btn-ghost" onclick="prevStep()">Voltar</button>
                    <button type="submit" class="btn-primary">Finalizar Cadastro</button>
                </div>
            </div>
        </div>
    </form>
    <script src="js/register.js"></script>
</body>
</html>
