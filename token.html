<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Verificação de Identidade</title>
    <style>
        :root {
            --bg-global: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --brand-green: #16a34a;
            --brand-green-hover: #15803d;
            --border-light: #e2e8f0;
            --input-focus: #bbf7d0;
        }
        body {
            background-color: var(--bg-global);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .token-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 45px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }
        .brand-header img.logo { 
            max-height: 85px; 
            margin-bottom: 16px; 
        }
        h2 { font-size: 20px; font-weight: 600; margin: 0 0 10px 0; color: var(--text-primary); }
        p.description { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .input-code-group input { 
            width: 100%; 
            padding: 14px; 
            background-color: #fff; 
            border: 1px solid var(--border-light); 
            border-radius: 10px; 
            color: var(--text-primary); 
            font-size: 24px; 
            font-weight: 700; 
            letter-spacing: 8px; 
            text-align: center; 
            box-sizing: border-box; 
            transition: all 0.2s; 
        }
        .input-code-group input:focus { outline: none; border-color: var(--brand-green); box-shadow: 0 0 0 3px var(--input-focus); }
        .btn-verify { width: 100%; padding: 14px; background-color: var(--brand-green); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 25px; }
        .btn-verify:hover { background-color: var(--brand-green-hover); }
        .back-to-login { display: inline-block; margin-top: 25px; color: var(--text-secondary); text-decoration: none; font-size: 13px; }
        .back-to-login:hover { color: var(--brand-green); text-decoration: underline; }
        .alert-box { margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 13px; display: none; text-align: left; }
        .alert-error { background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; }
        .alert-success { background-color: #f0fdf4; border: 1px solid #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="token-wrapper">
        <div class="brand-header">
            <img src="img/logo2 copy.png" alt="Logo" class="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2942/2942780.png'">
        </div>

        <h2>Verificação de Segurança</h2>
        <p class="description">Introduza o código de validação de 6 dígitos enviado para a sua caixa de correio eletrónico corporativa.</p>

        <form id="tokenForm">
            <div class="input-code-group">
                <input type="text" id="codigo" placeholder="000000" maxlength="6" autocomplete="off" required>
            </div>

            <button type="submit" class="btn-verify">Confirmar Identidade</button>
            <div id="alertBox" class="alert-box"></div>

            <a href="index.html" class="back-to-login">← Voltar para o Login</a>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("tokenForm");
            const BASE_URL = "https://appdedetizacao.onrender.com";

            if (!form) {
                console.error("Erro: Formulário não foi encontrado.");
                return;
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                validarToken();
            });

            async function validarToken() {
                const codigoInput = document.getElementById("codigo");
                const btnSubmit = form.querySelector("button");
                
                if (!codigoInput) {
                    alert("Erro interno: Campo de código de verificação não encontrado.");
                    return;
                }

                const codigo = codigoInput.value.trim();
                const email = localStorage.getItem("emailTemp") || localStorage.getItem("logging_email");

                if (!email) {
                    alert("Sessão expirada ou inválida. Por favor, faça o login novamente.");
                    window.location.href = "index.html";
                    return;
                }

                if (!codigo) {
                    alert("Por favor, insira o código de autenticação enviado ao seu e-mail.");
                    return;
                }

                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = "〈 VALIDANDO ACESSO... 〉";
                btnSubmit.disabled = true;
                btnSubmit.style.boxShadow = "0 0 15px #00ffcc"; 
                btnSubmit.style.transition = "all 0.3s ease";

                try {
                    const response = await fetch(`${BASE_URL}/auth/validar`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, codigo })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || "Código de autenticação inválido ou expirado.");
                    }

                    const idEncontrado = data.id || data.empresaId || data.usuarioId;
                    
                    if (!idEncontrado) {
                        throw new Error("Erro de sincronização: O servidor não retornou sua ID.");
                    }

                    // 🚀 LIMPEZA CONTROLADA DOS DADOS TEMPORÁRIOS
                    localStorage.removeItem("emailTemp");
                    localStorage.removeItem("logging_email");
                    localStorage.removeItem("tipoTemp");

                    // 🔑 SALVAMENTO BLINDADO - GERANDO TODAS AS CHAVES NECESSÁRIAS
                    localStorage.setItem("token_usuario", data.token); // 🌟 ESSA COMPLETA O FLUXO DO DASHBOARD E ANDROID!
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("TOKEN_AUTH", data.token);
                    
                    localStorage.setItem("empresaId", idEncontrado);
                    localStorage.setItem("usuario_id", idEncontrado);
                    
                    localStorage.setItem("tipoUsuario", data.tipo);
                    localStorage.setItem("userName", data.nome || "Operador");
                    localStorage.setItem("empresaNome", data.nome || "Operador");
                    localStorage.setItem("userEmail", email);

                    console.log("🟢 Chaves de acesso alinhadas com sucesso no LocalStorage.");

                    const tipoTratado = data.tipo ? data.tipo.toUpperCase() : "EMPRESA";
                    let destino = "dashboard_empresa.html";
                    
                    if (tipoTratado === "ADMIN" || tipoTratado === "ADMINISTRADOR") {
                        destino = "dashboard_admin.html";
                    } else if (tipoTratado === "CLIENTE") {
                        destino = "dashboard_cliente.html";
                    }

                    btnSubmit.innerHTML = "〈 CONEXÃO ESTABELECIDA 〉";
                    btnSubmit.style.boxShadow = "0 0 20px #00ff55";
                    btnSubmit.style.color = "#00ff55";

                    setTimeout(() => {
                        window.location.href = destino;
                    }, 1000);

                } catch (err) {
                    alert(err.message);
                    btnSubmit.innerHTML = originalText;
                    btnSubmit.disabled = false;
                    btnSubmit.style.boxShadow = "";
                    btnSubmit.style.color = "";
                }
            }
        });
    </script>
</body>
</html>
