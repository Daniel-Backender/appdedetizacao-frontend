<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Verificação de Identidade</title>
    <style>
        :root {
            --bg-global: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --brand-green: #16a34a;
            --brand-green-hover: #15803d;
            --border-light: #e2e8f0;
            --input-focus: #bbf7d0;
        }
        body {
            background-color: var(--bg-global);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .token-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 45px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            box-sizing: border-box;
        }
        .brand-header img.logo { max-height: 55px; margin-bottom: 15px; }
        h2 { font-size: 18px; font-weight: 600; margin: 0 0 8px 0; color: var(--text-primary); }
        p.description { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .input-code-group input { width: 100%; padding: 12px; background-color: #fff; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-primary); font-size: 22px; font-weight: 700; letter-spacing: 8px; text-align: center; box-sizing: border-box; transition: all 0.2s; }
        .input-code-group input:focus { outline: none; border-color: var(--brand-green); box-shadow: 0 0 0 3px var(--input-focus); }
        .btn-verify { width: 100%; padding: 14px; background-color: var(--brand-green); border: none; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 20px; }
        .btn-verify:hover { background-color: var(--brand-green-hover); }
        .back-to-login { display: inline-block; margin-top: 25px; color: var(--text-secondary); text-decoration: none; font-size: 13px; }
        .back-to-login:hover { color: var(--brand-green); text-decoration: underline; }
        .alert-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 13px; display: none; text-align: left; }
        .alert-error { background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; }
        .alert-success { background-color: #f0fdf4; border: 1px solid #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="token-wrapper">
        <div class="brand-header">
            <img src="img/logo2 copy.png" alt="Logo" class="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2942/2942780.png'">
        </div>

        <h2>Verificação de Segurança</h2>
        <p class="description">Introduza o código de validação de 6 dígitos enviado para a sua caixa de correio eletrónico corporativa.</p>

        <form id="tokenForm">
            <div class="input-code-group">
                <input type="text" id="codigo" placeholder="000000" maxlength="6" autocomplete="off" required>
            </div>

            <button type="submit" class="btn-verify">Confirmar Identidade</button>
            <div id="alertBox" class="alert-box"></div>

            <a href="index.html" class="back-to-login">← Voltar para o Login</a>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';

        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const codigo = document.getElementById('codigo').value;
            const email = localStorage.getItem('logging_email');
            const alertBox = document.getElementById('alertBox');

            if (!email) {
                alertBox.className = 'alert-box alert-error';
                alertBox.textContent = 'Sessão expirada. Por favor, reinicie o processo de login.';
                alertBox.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/verificar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, codigo })
                });
                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert-box alert-success';
                    alertBox.textContent = 'Identidade validada com sucesso! A redirecionar...';
                    alertBox.style.display = 'block';

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario_nome', data.nome);
                    localStorage.setItem('usuario_tipo', data.tipo);
                    localStorage.setItem('usuario_id', data.id);
                    localStorage.removeItem('logging_email');

                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.textContent = data.message || 'Código incorreto ou expirado.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.textContent = 'Erro ao contactar o servidor de autenticação.';
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
