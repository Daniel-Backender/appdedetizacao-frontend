<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação - PestControlX</title>
    <link rel="stylesheet" href="css/token.css">
</head>
<body>
    <div class="token-container">
        <div class="token-box">
            <div class="header-app">
                <img src="img/logo2 copy.png" alt="Logo" class="logo-img">
                <img src="img/nomeapp copy.png" alt="PestControlX" class="app-name-img">
            </div>

            <p class="status-label">VERIFICAÇÃO DE SEGURANÇA</p>
            <p class="subtitle">Insira o código enviado ao seu e-mail corporativo.</p>

            <form id="form-token">
                <div class="input-group">
                    <input type="text" id="codigo" placeholder="000000" maxlength="6" required>
                </div>

                <button type="submit" class="btn-validate">VALIDAR ACESSO</button>

                <a href="index.html" class="back-link">← VOLTAR AO LOGIN</a>
            </form>
        </div>
    </div>
    <script src="js/token.js" defer></script>
</body>
</html>
