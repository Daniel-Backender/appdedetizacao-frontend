<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Funcionário - PestControlX</title>
</head>

<body>
<link rel="stylesheet" href="css/dashboard.css">

<div class="container">

    <div class="dashboard-box">
        <h2>Painel do Funcionário</h2>
        <p>Técnico: <span id="userName"></span></p>
    </div>

    <div class="dashboard-box">
        <h3>Ordens de Serviço</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="ordens"></tbody>
        </table>

    </div>

    <button onclick="logout()">Sair</button>

</div>

<script src="js/dash_funcionario.js"></script>
</body>
</html>
