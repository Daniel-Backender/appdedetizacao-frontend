<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PestControlX - Chat Técnico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #3DDC84; font-family: 'Courier New', monospace; padding: 20px; }
        #chat { height: 400px; border: 2px solid #3DDC84; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #000; box-shadow: 0 0 10px #3DDC84; }
        input { width: 80%; padding: 10px; background: #111; border: 1px solid #3DDC84; color: #fff; outline: none; }
        button { padding: 10px 20px; background: #3DDC84; border: none; font-weight: bold; cursor: pointer; color: #000; }
        .msg-empresa { color: #3DDC84; }
        .msg-tecnico { color: #ffffff; }
    </style>
</head>
<body>
    <h1>[ PESTCONTROL-X CHAT ]</h1>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="Resposta para o técnico..." onkeypress="if(event.key==='Enter') enviar()">
    <button onclick="enviar()">ENVIAR</button>

    <script>
        var stompClient = null;
        // URL DO SEU RENDER CORRIGIDA
        const SOCKET_URL = 'https://appdedetizacao.onrender.com/ws-pestcontrol';

        function conectar() {
            var socket = new SockJS(SOCKET_URL);
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                console.log('Conectado!');
                stompClient.subscribe('/topic/mensagens', function (msg) {
                    var dados = JSON.parse(msg.body);
                    var chat = document.getElementById('chat');
                    
                    // Ajustado para 'texto' (conforme seu Java)
                    var classe = dados.remetente === 'EMPRESA' ? 'msg-empresa' : 'msg-tecnico';
                    chat.innerHTML += `<p class="${classe}"><strong>${dados.remetente}:</strong> ${dados.texto}</p>`;
                    chat.scrollTop = chat.scrollHeight;
                });
            }, function(error) {
                setTimeout(conectar, 5000);
            });
        }

        function enviar() {
            var input = document.getElementById('msg');
            var texto = input.value.trim();
            if (texto && stompClient) {
                // Enviando como 'texto' para o Java entender
                var payload = JSON.stringify({'remetente': 'EMPRESA', 'texto': texto});
                stompClient.send("/app/enviar", {}, payload);
                input.value = '';
            }
        }

        conectar();
    </script>
</body>
</html>
