<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PestControlX - Painel Empresa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #3DDC84; font-family: 'Courier New', monospace; padding: 20px; }
        #chat { height: 400px; border: 2px solid #3DDC84; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #000; box-shadow: 0 0 10px #3DDC84; }
        input { width: 80%; padding: 10px; background: #111; border: 1px solid #3DDC84; color: #fff; }
        button { padding: 10px 20px; background: #3DDC84; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>[ PESTCONTROL-X CHAT ]</h1>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="Resposta para o técnico...">
    <button onclick="enviar()">ENVIAR</button>

    <script>
        var stompClient = null;

        function conectar() {
            // Troque pela URL do seu Render
            var socket = new SockJS('https://seu-pest-control-api.render.com/ws-pestcontrol');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                console.log('Conectado!');
                stompClient.subscribe('/topic/mensagens', function (msg) {
                    var dados = JSON.parse(msg.body);
                    var chat = document.getElementById('chat');
                    chat.innerHTML += "<p><strong>" + dados.remetente + ":</strong> " + dados.conteudo + "</p>";
                    chat.scrollTop = chat.scrollHeight;
                });
            });
        }

        function enviar() {
            var texto = document.getElementById('msg').value;
            var payload = JSON.stringify({'remetente': 'EMPRESA', 'conteudo': texto});
            stompClient.send("/app/enviar", {}, payload);
            document.getElementById('msg').value = '';
        }

        conectar();
    </script>
</body>
</html>
