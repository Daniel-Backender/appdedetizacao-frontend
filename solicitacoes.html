<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding: 20px;">
    <script src="js/theme.js"></script>

    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
        <h1 style="color: var(--text-main);">Monitoramento de Campo</h1>
        <span style="color: var(--primary); font-weight: bold;">Sincronizado</span>
    </div>

    <div class="kanban-board">
        <div class="kanban-col">
            <div class="kanban-header badge-danger">Pendentes</div>
            <div id="col-pendentes"></div>
        </div>
        <div class="kanban-col">
            <div class="kanban-header badge-warning">Em Andamento</div>
            <div id="col-campo"></div>
        </div>
        <div class="kanban-col">
            <div class="kanban-header badge-success">Concluídas</div>
            <div id="col-concluidas"></div>
        </div>
    </div>

    <script src="js/solicitacoes.js"></script>
</body>
</html>
