<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3DDC84;
            --surface: #161B26;
            --border: #2D3748;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            background: transparent;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: start;
        }
        .kanban-col {
            background: #11141D;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            min-height: 500px;
        }
        .kanban-header {
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid #EF4444; }
        .badge-warning { background: rgba(250, 204, 21, 0.15); color: #FACC15; border: 1px solid #FACC15; }
        .badge-success { background: rgba(61, 220, 132, 0.15); color: #3DDC84; border: 1px solid #3DDC84; }

        .os-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .os-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(61, 220, 132, 0.15);
            transform: translateY(-2px);
        }
        .os-action-btn {
            width: 100%;
            background: #0F0F12;
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }
        .os-action-btn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        .btn-refresh {
            background: var(--primary); color: #000; border: none;
            padding: 10px 18px; font-weight: bold; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-refresh:hover { box-shadow: 0 0 12px var(--primary); }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');</script>

    <div class="top-bar">
        <h1 style="font-size: 24px; margin:0;"><i class="fa-solid fa-columns" style="color: var(--primary)"></i> Painel de Solicitações</h1>
        <button class="btn-refresh" onclick="carregarOrdens()">
            <i class="fa-solid fa-rotate-right"></i> Sincronizar Central
        </button>
    </div>

    <div class="kanban-board">
        <div class="kanban-col">
            <div class="kanban-header badge-danger">
                <span><i class="fa-solid fa-circle-exclamation"></i> Novas Solicitações</span>
                <span id="count-pendentes" style="font-size:12px;">0</span>
            </div>
            <div id="col-pendentes"></div>
        </div>
        
        <div class="kanban-col">
            <div class="kanban-header badge-warning">
                <span><i class="fa-solid fa-person-digging"></i> Em Atendimento</span>
                <span id="count-campo" style="font-size:12px;">0</span>
            </div>
            <div id="col-campo"></div>
        </div>
        
        <div class="kanban-col">
            <div class="kanban-header badge-success">
                <span><i class="fa-solid fa-circle-check"></i> Concluídas</span>
                <span id="count-concluidas" style="font-size:12px;">0</span>
            </div>
            <div id="col-concluidas"></div>
        </div>
    </div>

    <script>
   const API_URL = "https://appdedetizacao.onrender.com/api";
    let loopDeAtualizacao; 

    function obterTokenSeguro() {
        return localStorage.getItem("TOKEN_AUTH") || 
               localStorage.getItem("token") || 
               localStorage.getItem("token_usuario");
    }

    function obterIdEmpresaLogada() {
        return localStorage.getItem("usuario_id") || localStorage.getItem("empresaId"); 
    }

    async function carregarOrdens() {
    // 🚀 BUSCA SEGURA: Tenta pegar o Token salvo no localStorage (testa as duas chaves possíveis)
    const token = localStorage.getItem('token_usuario') || localStorage.getItem('token');
    
    if (!token) {
        console.error("❌ Erro: Nenhum token encontrado no localStorage!");
        alert("Sessão expirada. Por favor, refaça o login.");
        window.location.href = 'index.html';
        return;
    }

    try {
        // Altere a URL abaixo para a sua rota do Render dinâmica ou estática se necessário
        const response = await fetch('https://appdedetizacao.onrender.com/api/ordens/empresa/3', {
            method: 'GET',
            headers: {
                // 🚀 O SEGREDO QUE ESTAVA FALTANDO: Injetar o token Bearer na requisição
                'Authorization': `Bearer ${token}`, 
                'Content-Type': 'application/json'
            }
        });

        if (response.status === 401) {
            console.error("❌ O servidor recusou o Token enviado.");
            alert("Sessão expirada. Realize o login novamente.");
            window.location.href = 'index.html';
            return;
        }

        if (!response.ok) {
            throw new Error(`Erro na resposta do servidor: ${response.status}`);
        }

        const ordens = await response.json();
        
        // 🟢 PROSSIGA COM A SUA LÓGICA ORIGINAL AQUI (renderizar na tabela, etc.)
        console.log("Ordens carregadas com sucesso:", ordens);

    } catch (error) {
        console.error("❌ Erro ao processar a requisição de ordens:", error);
    }
}

    async function atualizarStatus(id, novoStatus) {
        try {
            const token = obterTokenSeguro();
            const corpoRequisicao = { status: novoStatus };
            
            const response = await fetch(`${API_URL}/ordens/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(corpoRequisicao)
            });

            if (response.status === 401 || response.status === 403) {
                clearInterval(loopDeAtualizacao);
                localStorage.clear();
                alert("Sessão expirada! Faça login novamente.");
                window.parent.location.href = "index.html";
                return;
            }

            if (response.ok) {
                // 🚀 CORREÇÃO: Mensagem dinâmica baseada no destino da ação
                if (novoStatus === 'EM_ANDAMENTO') {
                    alert(`Chamado #${id} aprovado com sucesso! O técnico já pode visualizar em campo.`);
                } else if (novoStatus === 'CONCLUIDA') {
                    alert(`Ordem de Serviço #${id} finalizada e arquivada com sucesso!`);
                } else {
                    alert(`Status da OS #${id} atualizado para ${novoStatus}.`);
                }
                carregarOrdens(); 
            } else {
                alert("Falha ao salvar no banco de dados. Status: " + response.status);
            }
        } catch(err) {
            console.error(err);
            alert("Erro de conexão com o servidor.");
        }
    }

    // Inicialização Protegida
    carregarOrdens();
    const taxaRefresh = parseInt(localStorage.getItem('kanban_refresh_rate')) || 15000;
    loopDeAtualizacao = setInterval(carregarOrdens, taxaRefresh);

    </script>
</body>
</html>
