<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3DDC84;
            --surface: #161B26;
            --border: #2D3748;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            background: transparent;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: start;
        }
        .kanban-col {
            background: #11141D;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            min-height: 500px;
        }
        .kanban-header {
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid #EF4444; }
        .badge-warning { background: rgba(250, 204, 21, 0.15); color: #FACC15; border: 1px solid #FACC15; }
        .badge-success { background: rgba(61, 220, 132, 0.15); color: #3DDC84; border: 1px solid #3DDC84; }

        .os-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .os-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(61, 220, 132, 0.15);
            transform: translateY(-2px);
        }
        .os-action-btn {
            width: 100%;
            background: #0F0F12;
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }
        .os-action-btn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        .btn-refresh {
            background: var(--primary); color: #000; border: none;
            padding: 10px 18px; font-weight: bold; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-refresh:hover { box-shadow: 0 0 12px var(--primary); }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');</script>

    <div class="top-bar">
        <h1 style="font-size: 24px; margin:0;"><i class="fa-solid fa-columns" style="color: var(--primary)"></i> Painel de Solicitações</h1>
        <button class="btn-refresh" onclick="carregarOrdens()">
            <i class="fa-solid fa-rotate-right"></i> Sincronizar Central
        </button>
    </div>

    <div class="kanban-board">
        <div class="kanban-col">
            <div class="kanban-header badge-danger">
                <span><i class="fa-solid fa-circle-exclamation"></i> Novas Solicitações</span>
                <span id="count-pendentes" style="font-size:12px;">0</span>
            </div>
            <div id="col-pendentes"></div>
        </div>
        
        <div class="kanban-col">
            <div class="kanban-header badge-warning">
                <span><i class="fa-solid fa-person-digging"></i> Em Atendimento</span>
                <span id="count-campo" style="font-size:12px;">0</span>
            </div>
            <div id="col-campo"></div>
        </div>
        
        <div class="kanban-col">
            <div class="kanban-header badge-success">
                <span><i class="fa-solid fa-circle-check"></i> Concluídas</span>
                <span id="count-concluidas" style="font-size:12px;">0</span>
            </div>
            <div id="col-concluidas"></div>
        </div>
    </div>

    <script>
    const API_URL = "https://appdedetizacao.onrender.com/api";

    function obterTokenSeguro() {
        return localStorage.getItem("TOKEN_AUTH") || 
               localStorage.getItem("token") || 
               localStorage.getItem("token_usuario");
    }

    // Pega o ID da Empresa logada no Painel Vercel para puxar só as OS dela
    function obterIdEmpresaLogada() {
        return localStorage.getItem("usuario_id") || localStorage.getItem("id_empresa"); 
    }

    async function carregarOrdens() {
        try {
            const token = obterTokenSeguro();
            const empresaId = obterIdEmpresaLogada();

            if (!token) {
                console.warn("Usuário não logado. Redirecionando...");
                // logout(); // Descomente para forçar a saída se não tiver token
                return;
            }

            // Busca as ORDENS da empresa logada (e não solicitações genéricas)
            const endpoint = empresaId ? `${API_URL}/ordens/empresa/${empresaId}` : `${API_URL}/ordens`;

            const response = await fetch(endpoint, { 
                method: 'GET',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                } 
            });
            
            if (response.status === 401 || response.status === 403) {
                console.error("Sessão expirada. O token é inválido.");
                return;
            }
            if (!response.ok) throw new Error("Erro na requisição: " + response.status);
            
            const ordens = await response.json();
            
            document.getElementById('col-pendentes').innerHTML = '';
            document.getElementById('col-campo').innerHTML = '';
            document.getElementById('col-concluidas').innerHTML = '';

            let cp = 0, ca = 0, cc = 0;

            ordens.forEach(os => {
                let btnAcao = '';
                
                // Trata a falta de padrão entre PENDENTE, NOVA e SOLICITADO
                const statusNormalizado = (os.status || '').toUpperCase();

                if (statusNormalizado === 'PENDENTE' || statusNormalizado === 'NOVAS' || statusNormalizado === 'SOLICITADO') {
                    cp++;
                    btnAcao = `<button class="os-action-btn" onclick="atualizarStatus(${os.id}, 'EM_ANDAMENTO')"><i class="fa-solid fa-forward"></i> Aprovar Chamado</button>`;
                } else if (statusNormalizado === 'EM_ANDAMENTO' || statusNormalizado === 'EM_ATENDIMENTO') {
                    ca++;
                    btnAcao = `<button class="os-action-btn" onclick="atualizarStatus(${os.id}, 'CONCLUIDA')"><i class="fa-solid fa-check"></i> Finalizar Serviço</button>`;
                } else {
                    cc++;
                    btnAcao = `<div style="text-align: center; color: var(--primary); font-weight: bold; font-size: 11px; margin-top: 12px; letter-spacing: 0.5px;"><i class="fa-solid fa-check-double"></i> OS ARQUIVADA</div>`;
                }

                // Evita quebra de código se as entidades Java vierem nulas
                const descricaoCard = os.descricao || os.texto || "Inspeção Solicitada";
                const nomeCliente = (os.cliente && os.cliente.nome) ? os.cliente.nome : (os.clienteNome || "App Mobile");

                const card = `
                    <div class="os-card">
                        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-bottom:8px;">
                            <span>REGISTRO #${os.id}</span>
                            <span style="color:var(--primary); font-weight:bold;"><i class="fa-solid fa-bug"></i> INSPEÇÃO</span>
                        </div>
                        <h4 style="color: #fff; margin: 0 0 8px 0; font-size: 14px; font-weight:600; line-height:1.4;">${descricaoCard}</h4>
                        <p style="color: var(--text-muted); font-size: 12px; margin: 0;">
                            <strong style="color:#fff;">Cliente:</strong> ${nomeCliente}
                        </p>
                        ${btnAcao}
                    </div>
                `;
                
                if (statusNormalizado === 'PENDENTE' || statusNormalizado === 'NOVAS' || statusNormalizado === 'SOLICITADO') {
                    document.getElementById('col-pendentes').innerHTML += card;
                } else if (statusNormalizado === 'EM_ANDAMENTO' || statusNormalizado === 'EM_ATENDIMENTO') {
                    document.getElementById('col-campo').innerHTML += card;
                } else {
                    document.getElementById('col-concluidas').innerHTML += card;
                }
            });

            document.getElementById("count-pendentes").innerText = cp;
            document.getElementById("count-campo").innerText = ca;
            document.getElementById("count-concluidas").innerText = cc;

        } catch (e) {
            console.error("Erro ao carregar o quadro Kanban:", e);
        }
    }

    async function atualizarStatus(id, novoStatus) {
        try {
            const token = obterTokenSeguro();
            
            // Corpo exato que o Spring Boot exige para um PUT
            const corpoRequisicao = {
                status: novoStatus
            };
            
            const response = await fetch(`${API_URL}/ordens/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(corpoRequisicao)
            });

            if (response.status === 401 || response.status === 403) {
                alert("Sessão expirada! Faça login novamente.");
                return;
            }

            if (response.ok) {
                // A notificação Push (Firebase) já está sendo feita automaticamente pelo Backend
                // no OrdemDeServicoController.java quando o PUT responde "EM_ANDAMENTO".
                alert(`Chamado #${id} aprovado com sucesso! O cliente receberá a notificação.`);
                carregarOrdens(); 
            } else {
                alert("Falha ao salvar no banco de dados. Status: " + response.status);
            }
        } catch(err) {
            console.error(err);
            alert("Erro de conexão com o servidor.");
        }
    }

    // Inicialização
    carregarOrdens();
    const taxaRefresh = parseInt(localStorage.getItem('kanban_refresh_rate')) || 15000;
    setInterval(carregarOrdens, taxaRefresh);

</script>
</body>
</html>
