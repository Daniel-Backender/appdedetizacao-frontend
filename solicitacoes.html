<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="padding: 25px; background: transparent;">
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');</script>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="color: var(--text-main); font-size: 24px;">Painel de Solicitações</h1>
        <button class="btn-green" onclick="carregarOrdens()"><i class="fa-solid fa-rotate-right"></i> Atualizar Agora</button>
    </div>

    <div class="kanban-board">
        <div class="kanban-col">
            <div class="kanban-header badge-danger">Novas Solitações</div>
            <div id="col-pendentes"></div>
        </div>
        <div class="kanban-col">
            <div class="kanban-header badge-warning">Em Atendimento</div>
            <div id="col-campo"></div>
        </div>
        <div class="kanban-col">
            <div class="kanban-header badge-success">Concluídas</div>
            <div id="col-concluidas"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://appdedetizacao.onrender.com/api/solicitacoes";
   
        const token = localStorage.getItem("token") || localStorage.getItem("meu_token_chave");

        async function carregarOrdens() {
            try {
                const response = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) return;
                const ordens = await response.json();
                
                document.getElementById('col-pendentes').innerHTML = '';
                document.getElementById('col-campo').innerHTML = '';
                document.getElementById('col-concluidas').innerHTML = '';

                ordens.forEach(os => {
                    let btnAcao = '';
                    if (os.status === 'PENDENTE') {
                        btnAcao = `<button class="os-action-btn" onclick="atualizarStatus(${os.id}, 'EM_ANDAMENTO')">Aprovar Chamado</button>`;
                    } else if (os.status === 'EM_ANDAMENTO') {
                        btnAcao = `<button class="os-action-btn" onclick="atualizarStatus(${os.id}, 'CONCLUIDA')">Finalizar Serviço</button>`;
                    } else {
                        btnAcao = `<div style="text-align: center; color: var(--primary); font-weight: bold; font-size: 11px; margin-top: 10px;"><i class="fa-solid fa-check-double"></i> ARQUIVADO</div>`;
                    }

                    const card = `
                        <div class="os-card">
                            <h4 style="color: var(--text-main); margin-bottom: 5px; font-size: 15px;">#${os.id} - ${os.descricao}</h4>
                            <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 5px;"><strong>Cliente:</strong> ${os.clienteNome || 'App'}</p>
                            ${btnAcao}
                        </div>
                    `;
                    
                    if (os.status === 'PENDENTE') document.getElementById('col-pendentes').innerHTML += card;
                    else if (os.status === 'EM_ANDAMENTO') document.getElementById('col-campo').innerHTML += card;
                    else document.getElementById('col-concluidas').innerHTML += card;
                });
            } catch (e) {
                console.error("Erro de Rede:", e);
            }
        }

        async function atualizarStatus(id, novoStatus) {
            try {
                // Altere a URL abaixo caso seu backend atualize via PUT /api/ordens/{id}
                const response = await fetch(`https://appdedetizacao.onrender.com/api/ordens/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status: novoStatus })
                });
                if(response.ok) carregarOrdens();
                else alert("Falha ao salvar no banco de dados.");
            } catch(err) {
                alert("Erro de conexão.");
            }
        }

        carregarOrdens();
        setInterval(carregarOrdens, 15000); // Atualiza a cada 15 seg
    </script>
</body>
</html>
