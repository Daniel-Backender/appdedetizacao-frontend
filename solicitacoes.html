<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Painel de Controle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-backend: #0a0f1d;
            --surface: #131c31;
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.3);
            --success: #39ff14;
            --text: #ffffff;
            --text-muted: #8b9bb4;
            --border: #1e2d4a;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-backend);
            color: var(--text);
        }

        .container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        h2 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-glow);
            margin-bottom: 25px;
        }

        /* Estrutura de colunas */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .kanban-column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            min-height: 500px;
        }

        .column-header {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .badge {
            background: var(--border);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary);
        }

        /* Cards do Kanban estilo Neon Industrial */
        .os-card {
            background: #1a2642;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .os-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .os-action-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px;
            border-radius: 4px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .os-action-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Seção Lateral do Mapa GPS */
        .gps-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        #map {
            width: 100%;
            height: 350px;
            border-radius: 6px;
            background: #000;
            border: 1px solid var(--border);
        }

        .gps-status {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px;
            background: #1a2642;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-satellite-dish"></i> Painel Operacional X-Pipeline</h2>

        <div class="dashboard-grid">
            
            <div class="kanban-board">
                <div class="kanban-column">
                    <div class="column-header">Pendentes <span class="badge" id="count-pendentes">0</span></div>
                    <div id="col-pendentes"></div>
                </div>
                <div class="kanban-column">
                    <div class="column-header">Em Campo <span class="badge" id="count-campo">0</span></div>
                    <div id="col-campo"></div>
                </div>
                <div class="kanban-column">
                    <div class="column-header">Concluídas <span class="badge" id="count-concluidas">0</span></div>
                    <div id="col-concluidas"></div>
                </div>
            </div>

            <div class="gps-panel">
                <div class="column-header"><i class="fa-solid fa-map-location-dot"></i> Rastreamento Técnico (GPS)</div>
                <div id="map"></div>
                <div class="gps-status" id="status-gps">
                    <i class="fa-solid fa-circle-info"></i> Clique em um card em andamento para interceptar o sinal do GPS.
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_URL = "https://appdedetizacao.onrender.com/api";
        let loopDeAtualizacao; 
        let stompClient = null;
        let map = null;
        let tecnicoMarker = null;
        let inscricaoAtualGps = null;

        // Inicializa o Mapa Leaflet com visualização padrão do Brasil
        function inicializarMapa() {
            map = L.map('map').setView([-23.55052, -46.633308], 12); // Padrão SP
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function obterTokenSeguro() {
            return localStorage.getItem("token") || localStorage.getItem("tokenJWT");
        }

        function obterIdEmpresaLogada() {
            return localStorage.getItem("empresaId") || "1"; 
        }

        // Conecta ao canal do WebSocket para escutar o GPS do técnico selecionado
        function conectarRastreamentoGps(ordemId) {
            // Se já existia uma escuta ativa, cancela para não duplicar consumo de memória
            if (inscricaoAtualGps) {
                inscricaoAtualGps.unsubscribe();
                inscricaoAtualGps = null;
            }

            const statusTxt = document.getElementById("status-gps");
            statusTxt.innerHTML = `<i class="fa-solid fa-spinner fa-spin" style="color: var(--primary)"></i> Conectando ao sinal da OS #${ordemId}...`;

            if (!stompClient) {
                const socket = new SockJS('https://appdedetizacao.onrender.com/ws-pestcontrol-sockjs');
                stompClient = Stomp.over(socket);
                // Oculta logs poluídos no console do navegador
                stompClient.debug = null; 
            }

            if (!stompClient.connected) {
                stompClient.connect({}, function () {
                    escutarCanalGps(ordemId);
                }, function(erro) {
                    console.error("Erro WebSocket:", erro);
                    statusTxt.innerText = "❌ Falha ao se conectar com o servidor de satélites.";
                });
            } else {
                escutarCanalGps(ordemId);
            }
        }

        function escutarCanalGps(ordemId) {
            const statusTxt = document.getElementById("status-gps");
            
            inscricaoAtualGps = stompClient.subscribe(`/topic/gps/${ordemId}`, function (respostaGps) {
                const dadosGps = JSON.parse(respostaGps.body);
                const { latitude, longitude } = dadosGps;

                statusTxt.innerHTML = `<span style="color: var(--success)"><i class="fa-solid fa-satellite"></i> Sinal Online! Lat: ${latitude.toFixed(4)}, Lng: ${longitude.toFixed(4)}</span>`;

                const novaPosicao = [latitude, longitude];
                
                if (!tecnicoMarker) {
                    tecnicoMarker = L.marker(novaPosicao).addTo(map)
                        .bindPopup(`<b>Técnico na OS #${ordemId}</b>`).openPopup();
                } else {
                    tecnicoMarker.setLatLng(novaPosicao);
                }
                map.setView(novaPosicao, 16); // Dá zoom direto no técnico em movimento
            });

            statusTxt.innerHTML = `<i class="fa-solid fa-satellite"></i> Escutando telemetria da OS #${ordemId}. Aguardando coordenadas...`;
        }

        async function carregarOrdens() {
            const token = obterTokenSeguro();
            const empresaId = obterIdEmpresaLogada();
            
            if (!token) {
                alert("Sessão expirada. Por favor, refaça o login.");
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ordens/empresa/${empresaId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`, 
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    window.location.href = 'index.html';
                    return;
                }

                if (!response.ok) throw new Error(`Erro: ${response.status}`);
                const ordens = await response.json();
                renderizarKanban(ordens);

            } catch (error) {
                console.error("❌ Erro ao buscar ordens:", error);
            }
        }

        function renderizarKanban(ordens) {
            const colPendentes = document.getElementById("col-pendentes");
            const colCampo = document.getElementById("col-campo");
            const colConcluidas = document.getElementById("col-concluidas");

            colPendentes.innerHTML = "";
            colCampo.innerHTML = "";
            colConcluidas.innerHTML = "";

            let qtdPendentes = 0, qtdCampo = 0, qtdConcluidas = 0;

            ordens.forEach(os => {
                const card = document.createElement("div");
                card.className = "os-card";
                
                // CORREÇÃO DA DESCRIÇÃO: Como não há o campo os.descricao no seu Java, extraímos do objeto Servico integrado!
                const nomeCliente = os.cliente ? os.cliente.nome : "Cliente Consumidor";
                const detalheServico = os.servico ? `${os.servico.nome} (${os.servico.descricao || ''})` : "Serviço Geral de Dedetização";

                card.innerHTML = `
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 6px;">OS #${os.id} - ${nomeCliente}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;"><i class="fa-solid fa-bug"></i> ${detalheServico}</div>
                    <div style="font-size: 11px; color: var(--primary);"><i class="fa-solid fa-calendar-days"></i> Agendado: ${os.dataAgendamento || 'Hoje'}</div>
                `;

                const statusLimpo = os.status ? os.status.toUpperCase() : "PENDENTE";

                if (statusLimpo === "PENDENTE") {
                    card.innerHTML += `<button class="os-action-btn" onclick="event.stopPropagation(); atualizarStatus(${os.id}, 'EM_ANDAMENTO')">Aprovar Chamado</button>`;
                    colPendentes.appendChild(card);
                    qtdPendentes++;
                } else if (statusLimpo === "EM_ANDAMENTO" || statusLimpo === "EM ATENDIMENTO") {
                    // Ao clicar no card em andamento, liga a antena do GPS!
                    card.setAttribute("onclick", `conectarRastreamentoGps(${os.id})`);
                    card.style.borderLeftColor = "var(--success)";
                    card.innerHTML += `<button class="os-action-btn" style="border-color: var(--success); color: var(--success)" onclick="event.stopPropagation(); atualizarStatus(${os.id}, 'CONCLUIDA')">Finalizar Serviço</button>`;
                    colCampo.appendChild(card);
                    qtdCampo++;
                } else if (statusLimpo === "CONCLUIDA" || statusLimpo === "CONCLUÍDA") {
                    card.style.borderLeftColor = "var(--text-muted)";
                    colConcluidas.appendChild(card);
                    qtdConcluidas++;
                }
            });

            document.getElementById("count-pendentes").innerText = qtdPendentes;
            document.getElementById("count-campo").innerText = qtdCampo;
            document.getElementById("count-concluidas").innerText = qtdConcluidas;
        }

        async function atualizarStatus(ordemId, novoStatus) {
            const token = obterTokenSeguro(); 
            try {
                // 1. Puxa o payload completo estruturado do banco para evitar corrupção de dados nulos
                const buscarOrdemRes = await fetch(`${API_URL}/ordens/${ordemId}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!buscarOrdemRes.ok) return;
                const ordemCompleta = await buscarOrdemRes.json();

                // 2. Transiciona estritamente o Status do Kanban
                ordemCompleta.status = novoStatus;

                // 3. Devolve para a API processar as automações de chat e push
                const response = await fetch(`${API_URL}/ordens/${ordemId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(ordemCompleta)
                });

                if (!response.ok) {
                    alert("Erro ao salvar alteração no painel.");
                    return;
                }

                alert("Ordem de serviço movida com sucesso!");
                await carregarOrdens();

            } catch (error) {
                console.error("❌ Erro de conexão ao atualizar ordem:", error);
            }
        }

        // Inicialização global da tela
        inicializarMapa();
        carregarOrdens();
        const taxaRefresh = parseInt(localStorage.getItem('kanban_refresh_rate')) || 15000;
        loopDeAtualizacao = setInterval(carregarOrdens, taxaRefresh);
    </script>
</body>
</html>
