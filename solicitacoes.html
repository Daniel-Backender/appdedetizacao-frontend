<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Solicitações - Kanban</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3DDC84;
            --surface: #161B26;
            --border: #2D3748;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            background: #0F0F12;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: start;
        }
        .kanban-col {
            background: #11141D;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            min-height: 500px;
        }
        .kanban-header {
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid #EF4444; }
        .badge-warning { background: rgba(250, 204, 21, 0.15); color: #FACC15; border: 1px solid #FACC15; }
        .badge-success { background: rgba(61, 220, 132, 0.15); color: #3DDC84; border: 1px solid #3DDC84; }

        .os-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .os-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(61, 220, 132, 0.15);
            transform: translateY(-2px);
        }
        .os-action-btn {
            width: 100%;
            background: #0F0F12;
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }
        .os-action-btn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        .btn-refresh {
            background: var(--primary); color: #000; border: none;
            padding: 10px 18px; font-weight: bold; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-refresh:hover { box-shadow: 0 0 12px var(--primary); }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1 style="font-size: 24px; margin:0;"><i class="fa-solid fa-columns" style="color: var(--primary)"></i> Painel de Solicitações</h1>
        <button class="btn-refresh" onclick="carregarOrdens()">
            <i class="fa-solid fa-rotate-right"></i> Sincronizar Central
        </button>
    </div>

    <div class="kanban-board">
        <div class="kanban-col">
            <div class="kanban-header badge-danger">
                <span><i class="fa-solid fa-circle-exclamation"></i> Novas Solicitações</span>
                <span id="count-pendentes" style="font-size:12px;">0</span>
            </div>
            <div id="col-pendentes"></div>
        </div>
        
        <div class="kanban-col">
            <div class="kanban-header badge-warning">
                <span><i class="fa-solid fa-person-digging"></i> Em Atendimento</span>
                <span id="count-campo" style="font-size:12px;">0</span>
            </div>
            <div id="col-campo"></div>
        </div>
        
        <div class="kanban-col">
            <div class="kanban-header badge-success">
                <span><i class="fa-solid fa-circle-check"></i> Concluídas</span>
                <span id="count-concluidas" style="font-size:12px;">0</span>
            </div>
            <div id="col-concluidas"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://appdedetizacao.onrender.com/api";
        let loopDeAtualizacao; 

        function obterTokenSeguro() {
            return localStorage.getItem("tokenJWT") || 
                   localStorage.getItem("token") || 
                   localStorage.getItem("token_usuario") ||
                   localStorage.getItem("TOKEN_AUTH");
        }

        function obterIdEmpresaLogada() {
            return localStorage.getItem("empresaId") || localStorage.getItem("usuario_id") || "1"; 
        }

        async function carregarOrdens() {
            const token = obterTokenSeguro();
            const empresaId = obterIdEmpresaLogada();
            
            if (!token) {
                console.error("❌ Erro: Nenhum token encontrado no localStorage!");
                alert("Sessão expirada. Por favor, refaça o login.");
                window.location.href = 'index.html';
                return;
            }

            try {
                // Sincronizado dinamicamente com a rota correta do Spring Boot
                const response = await fetch(`${API_URL}/ordens/empresa/${empresaId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`, 
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    alert("Sessão expirada. Realize o login novamente.");
                    window.location.href = 'index.html';
                    return;
                }

                if (!response.ok) throw new Error(`Erro: ${response.status}`);

                const ordens = await response.json();
                renderizarKanban(ordens);

            } catch (error) {
                console.error("❌ Erro ao buscar ordens:", error);
            }
        }

        function renderizarKanban(ordens) {
            const colPendentes = document.getElementById("col-pendentes");
            const colCampo = document.getElementById("col-campo");
            const colConcluidas = document.getElementById("col-concluidas");

            colPendentes.innerHTML = "";
            colCampo.innerHTML = "";
            colConcluidas.innerHTML = "";

            let qtdPendentes = 0, qtdCampo = 0, qtdConcluidas = 0;

            ordens.forEach(os => {
                const card = document.createElement("div");
                card.className = "os-card";
                card.innerHTML = `
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 6px;">OS #${os.id} - ${os.nomeCliente || (os.cliente ? os.cliente.nome : 'Cliente')}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">${os.descricao || 'Sem descrição cadastrada'}</div>
                    <div style="font-size: 11px; color: var(--primary);"><i class="fa-solid fa-calendar-days"></i> Agendado: ${os.dataAgendamento || 'Hoje'}</div>
                `;

                const statusLimpo = os.status ? os.status.toUpperCase() : "PENDENTE";

                if (statusLimpo === "PENDENTE") {
                    card.innerHTML += `<button class="os-action-btn" onclick="atualizarStatus(${os.id}, 'EM_ANDAMENTO')">Aprovar Chamado</button>`;
                    colPendentes.appendChild(card);
                    qtdPendentes++;
                } else if (statusLimpo === "EM_ANDAMENTO" || statusLimpo === "EM ATENDIMENTO") {
                    card.innerHTML += `<button class="os-action-btn" onclick="atualizarStatus(${os.id}, 'CONCLUIDA')">Finalizar Serviço</button>`;
                    colCampo.appendChild(card);
                    qtdCampo++;
                } else if (statusLimpo === "CONCLUIDA" || statusLimpo === "CONCLUÍDA") {
                    colConcluidas.appendChild(card);
                    qtdConcluidas++;
                }
            });

            document.getElementById("count-pendentes").innerText = qtdPendentes;
            document.getElementById("count-campo").innerText = qtdCampo;
            document.getElementById("count-concluidas").innerText = qtdConcluidas;
        }

        async function atualizarStatus(id, novoStatus) {
            try {
                const token = obterTokenSeguro();
                // Envia a atualização parcial para o banco de dados
                const response = await fetch(`${API_URL}/ordens/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ status: novoStatus })
                });

                if (response.ok) {
                    carregarOrdens(); 
                } else {
                    alert("Falha ao atualizar status. Código HTTP: " + response.status);
                }
            } catch(err) {
                console.error(err);
            }
        }

        carregarOrdens();
        const taxaRefresh = parseInt(localStorage.getItem('kanban_refresh_rate')) || 15000;
        loopDeAtualizacao = setInterval(carregarOrdens, taxaRefresh);
    </script>
</body>
</html>
