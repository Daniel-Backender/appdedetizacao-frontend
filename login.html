<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Acesso ao Sistema</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-container">
        <canvas id="starsCanvas"></canvas>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h1 class="login-logo">PestControlX</h1>
            <p class="login-status">IDENTIFICAÇÃO REQUERIDA</p>

            <form id="loginForm">

    <div class="input-group">
        <label>Tipo de Acesso</label>
        <select id="userType" required>
            <option value="CLIENTE">CLIENTE</option>
            <option value="FUNCIONARIO">FUNCIONÁRIO</option>
            <option value="EMPRESA">EMPRESA</option>
            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
        </select>
    </div>

    <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="email" required>
    </div>

    <!--  CAMPO DINÂMICO -->
    <div class="input-group" id="cnpjGroup" style="display:none;">
        <label>CNPJ</label>
        <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
    </div>

    <div class="input-group">
        <label>Senha</label>
        <input type="password" id="senha" required>
    </div>

    <button type="submit" class="btn-login">AUTENTICAR</button>

    <p style="margin-top:10px;">
        Primeira vez? <a href="register.html">Criar conta</a>
    </p>

</form>
            <a href="index.html" class="back-link">← Voltar ao Monitoramento</a>
        </div>
    </div>

    <script src="js/stars.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
