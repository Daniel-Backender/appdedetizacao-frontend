<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DedetiApp</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

   <div class="header-app">
    <div class="logo-wrapper">
         <img src="img/logo2 copy.png" alt="Logo PestControlX" class="logo-img">
    </div>
    <img src="img/nomeapp copy.png" alt="PestControlX" class="app-name-img">
    <p class="subtitle">Bem-vindo de volta!</p>
</div>

    <form id="loginForm">
        <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="••••••••" required>
        </div>

        <!-- Procure a div 'forgot-password' e substitua por esta -->
<div class="forgot-password">
    <a href="forgot-password.html">Esqueceu sua senha?</a>
</div>

        <button type="submit" class="btn-main">Entrar</button>

        <div class="register-link">
            <p>Não tem uma conta? <a href="register.html">Cadastre-se aqui</a></p>
        </div>
    </form>

</body>
</html>
