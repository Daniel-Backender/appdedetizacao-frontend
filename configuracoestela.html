<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding: 20px;">
    <script src="js/theme.js"></script>

    <h1 style="margin-bottom: 20px; color: var(--text-main);">Configurações e Preferências</h1>

    <div class="card">
        <h3 style="color: var(--primary); margin-bottom: 15px;">Aparência do Sistema</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
            <div>
                <div style="font-weight: bold; color: var(--text-main);">Modo Escuro (Cyber-Industrial)</div>
                <div style="font-size: 12px; color: var(--text-muted);">Altera o visual do painel para cores escuras e neon.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="card">
        <h3 style="color: var(--primary); margin-bottom: 15px;">Notificações PUSH Automáticas</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
            <div>
                <div style="font-weight: bold; color: var(--text-main);">Disparar Alerta para o Cliente (App)</div>
                <div style="font-size: 12px; color: var(--text-muted);">Avisa o celular do cliente quando você mover o card para "Em Andamento".</div>
            </div>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script src="js/configuracoes.js"></script>
</body>
</html>
