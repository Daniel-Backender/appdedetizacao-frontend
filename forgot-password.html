<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso - PestControlX</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        /* Estilo Cyber-Industrial Adicional */
        .neon-text {
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.7);
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        .instruction {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="header-app">
    <div class="logo-wrapper">
         <img src="img/logo2 copy.png" alt="Logo" class="logo-img">
    </div>
    <h2 class="neon-text">RECUPERAÇÃO DE SISTEMA</h2>
    <p class="instruction">Insira seu e-mail para receber um novo token de acesso.</p>
</div>

<form id="forgotForm">
    <div class="input-group">
        <label>E-mail de Registro</label>
        <input type="email" id="emailForgot" placeholder="terminal@access.com" required>
    </div>

    <button type="submit" class="btn-main" id="btnForgot">Solicitar Token</button>

    <div class="register-link">
        <p><a href="login.html">Voltar para o Login</a></p>
    </div>
</form>

<script src="js/forgot-password.js"></script>
</body>
</html>
