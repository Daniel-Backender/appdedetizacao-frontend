<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Sistema - PestControlX</title>
    <style>
        :root {
            --bg-cyber: #0d1117;
            --card-cyber: #161b22;
            --neon-amber: #ffaa00;
            --amber-glow: rgba(255, 170, 0, 0.2);
            --border-color: #30363d;
            --text-main: #c9d1d9;
        }
        body {
            background-color: var(--bg-cyber);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .container-recuperacao {
            background-color: var(--card-cyber);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px var(--amber-glow);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .logo-container img { width: 75px; height: auto; margin-bottom: 15px; filter: drop-shadow(0 0 8px var(--neon-amber)); }
        h2 { color: #fff; font-size: 18px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; color: var(--neon-amber); font-size: 11px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background-color: #0d1117; color: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.3s; }
        input:focus { outline: none; border-color: var(--neon-amber); box-shadow: 0 0 10px var(--amber-glow); }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(90deg, #ff8800, var(--neon-amber)); color: #0d1117; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.3s; letter-spacing: 0.5px; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 0 20px var(--neon-amber); }
        .link-voltar { display: inline-block; margin-top: 20px; color: #8b949e; text-decoration: none; font-size: 13px; }
        .link-voltar:hover { color: var(--neon-amber); text-decoration: underline; }
        .divider { border-top: 1px dashed var(--border-color); margin: 25px 0; }
        .message-box { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; text-align: left; }
        .message-error { background-color: rgba(248, 81, 73, 0.15); border: 1px solid #f85149; color: #ff7b72; }
        .message-success { background-color: rgba(46, 160, 67, 0.15); border: 1px solid #2ea043; color: #56d364; }
    </style>
</head>
<body>

    <div class="container-recuperacao">
        <div class="logo-container">
            <img src="img/logo2 copy.png" alt="PestControlX Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6295/6295417.png'">
        </div>
        
        <h2>1. Solicitar Resgate</h2>
        <p>Insira o seu e-mail para gerar um código de redefinição.</p>

        <form id="formForgotPassword">
            <div class="form-group">
                <label for="email">E-mail Registado</label>
                <input type="email" id="email" placeholder="operador@dominio.com" required>
            </div>
            <button type="submit" class="btn-submit">Enviar Código de Resgate</button>
            <div id="msgEtapa1" class="message-box"></div>
        </form>

        <div class="divider"></div>

        <h2>2. Redefinir Senha</h2>
        <p>Utilize o código de 6 dígitos enviado por e-mail.</p>
        
        <form id="formResetPassword">
            <div class="form-group">
                <label for="resetEmail">Confirme o E-mail</label>
                <input type="email" id="resetEmail" placeholder="operador@dominio.com" required>
            </div>
            
            <div class="form-group">
                <label for="codigo">Código de Verificação (6 dígitos)</label>
                <input type="text" id="codigo" placeholder="000000" maxlength="6" required>
            </div>

            <div class="form-group">
                <label for="novaSenha">Nova Senha de Acesso</label>
                <input type="password" id="novaSenha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" style="background: linear-gradient(90deg, #00ff88, #2ea043);">Atualizar Credenciais</button>
            <div id="msgEtapa2" class="message-box"></div>
        </form>

        <a href="index.html" class="link-voltar">← Voltar ao Terminal de Login</a>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';

        // Lógica do Form 1: Solicitação
        document.getElementById('formForgotPassword').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgBox = document.getElementById('msgEtapa1');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (response.ok) {
                    msgBox.className = 'message-box message-success';
                    msgBox.textContent = data.message || 'Código enviado! Verifique a sua caixa de entrada.';
                    document.getElementById('resetEmail').value = email; // Facilita preenchendo a etapa 2
                } else {
                    msgBox.className = 'message-box message-error';
                    msgBox.textContent = data.message || 'E-mail não localizado no sistema.';
                }
                msgBox.style.display = 'block';
            } catch (err) {
                msgBox.className = 'message-box message-error';
                msgBox.textContent = 'Erro ao contactar o servidor.';
                msgBox.style.display = 'block';
            }
        });

        // Lógica do Form 2: Redefinição Real
        document.getElementById('formResetPassword').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const codigo = document.getElementById('codigo').value;
            const novaSenha = document.getElementById('novaSenha').value;
            const msgBox = document.getElementById('msgEtapa2');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, codigo, novaSenha })
                });
                const data = await response.json();

                if (response.ok) {
                    msgBox.className = 'message-box message-success';
                    msgBox.textContent = 'Senha alterada com sucesso! A redirecionar para o login...';
                    msgBox.style.display = 'block';
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    msgBox.className = 'message-box message-error';
                    msgBox.textContent = data.message || 'Dados inválidos ou código incorreto/expirado.';
                    msgBox.style.display = 'block';
                }
            } catch (err) {
                msgBox.className = 'message-box message-error';
                msgBox.textContent = 'Erro ao processar alteração de credenciais.';
                msgBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
