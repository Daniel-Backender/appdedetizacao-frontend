<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestControlX - Recuperação de Sistema</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        :root {
            --bg-cyber: #0d1117;
            --card-cyber: #161b22;
            --neon-amber: #ffaa00;
            --amber-glow: rgba(255, 170, 0, 0.25);
            --border-color: #30363d;
            --text-main: #c9d1d9;
        }
        body {
            background-color: var(--bg-cyber);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container-recuperacao {
            background-color: var(--card-cyber);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px var(--amber-glow);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .logo-container img {
            width: 75px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px var(--neon-amber));
        }
        h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: var(--neon-amber);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #0d1117;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--neon-amber);
            box-shadow: 0 0 10px var(--amber-glow);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff8800, var(--neon-amber));
            color: #0d1117;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 20px var(--neon-amber);
        }
        .link-voltar {
            display: inline-block;
            margin-top: 25px;
            color: #8b949e;
            text-decoration: none;
            font-size: 13px;
        }
        .link-voltar:hover {
            color: var(--neon-amber);
            text-decoration: underline;
        }
        .divider {
            border-top: 1px dashed var(--border-color);
            margin: 25px 0;
        }
    </style>
</head>
<body>

    <div class="container-recuperacao">
        <div class="logo-container">
            <img src="img/logo2 copy.png" alt="PestControlX Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6295/6295417.png'">
        </div>
        
        <h2>Recuperação de Sistema</h2>
        <p>Painel central de reconfiguração de credenciais de segurança.</p>

        <form id="formForgotPassword">
            <div class="form-group">
                <label for="email">E-mail de Operação Registrado</label>
                <input type="email" id="email" placeholder="exemplo@dominio.com" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSolicitar">Disparar Token de Resgate</button>
        </form>

        <div class="divider"></div>

        <h2>Redefinir Credencial</h2>
        <p>Preencha os campos abaixo após o recebimento do e-mail.</p>
        
        <form id="formResetPassword">
            <div class="form-group">
                <label for="resetEmail">Confirme o E-mail</label>
                <input type="email" id="resetEmail" placeholder="exemplo@dominio.com" required>
            </div>
            
            <div class="form-group">
                <label for="codigo">Token de Resgate (6 dígitos)</label>
                <input type="text" id="codigo" placeholder="000000" maxlength="6" required>
            </div>

            <div class="form-group">
                <label for="novaSenha">Nova Senha do Operador</label>
                <input type="password" id="novaSenha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" style="background: linear-gradient(90deg, #00ff88, #3cb371)">Efetivar Nova Senha</button>
        </form>

        <a href="index.html" class="link-voltar">← Cancelar e Voltar ao Terminal</a>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>
